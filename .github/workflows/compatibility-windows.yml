name: Windows compatibility research build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['compatibility/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CMake for older dependency projects
        run: |
          python -m pip install cmake==3.31.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --version
      - name: Test executable preflight
        run: python -m unittest discover -s tests -v
      - name: Checkout reviewed launcher revision
        uses: actions/checkout@v4
        with:
          repository: TeamREPENTOGON/Launcher
          ref: c14b8721d50463ac0a7fb64cb0a33db73410920a
          path: _launcher
          submodules: recursive
      - name: Configure and compile mod and scanner (MSVC x86)
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          cmake -S . -B build -G 'Visual Studio 17 2022' -A Win32 "-DCMAKE_ZHL_VERSION=research-${{ github.sha }}" "-DCMAKE_REPENTOGON_VERSION=research-${{ github.sha }}" 2>&1 | Tee-Object build-logs/mod-configure.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config RelWithDebInfo --parallel 2 --target zhlREPENTOGON zhlLoader offline_scanner stbc 2>&1 | Tee-Object build-logs/mod-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure and compile launcher and updater (MSVC x86)
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          cmake -S _launcher -B launcher-build -G 'Visual Studio 17 2022' -A Win32 -DCMAKE_LAUNCHER_VERSION=research 2>&1 | Tee-Object build-logs/launcher-configure.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build launcher-build --config RelWithDebInfo --parallel 2 --target REPENTOGONLauncher REPENTOGONLauncherUpdater 2>&1 | Tee-Object build-logs/launcher-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package complete outputs with hashes
        run: ./compatibility/package.ps1
      - name: Upload research ZIP (not runtime certification)
        uses: actions/upload-artifact@v4
        with:
          name: REPENTOGON-research-win32-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
      - name: Retain diagnostics even on build failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.sha }}
          path: |
            build-logs/
            build/CMakeFiles/CMakeConfigureLog.yaml
            launcher-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
